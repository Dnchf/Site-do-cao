<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>adote</title>
    <link rel="stylesheet" href="Styles/adote.css">
</head>

<body>
    <div class="cards">

        <div class="card" onclick="abrirModal(this)">
            <img src="https://placedog.net/400/300?id=1">
        </div>

    </div>

    <!-- MODAL -->
    <div id="modal" class="modal">
        <div class="modal-content">

            <span class="fechar" onclick="fecharModal()">×</span>

            <img id="modal-img">
            <h2>Thor</h2>
            <p>Idade: 2 anos</p>
            <p>Amigável 🐶</p>

            <button>Adotar</button>

        </div>
    </div>
    <script>
        let cardOriginal = null;

        function abrirModal(card, nome, idade, desc) {
            const modal = document.getElementById("modal");
            const img = card.querySelector("img");

            cardOriginal = img;

            const modalImg = document.getElementById("modal-img");

            // Pega posição da imagem
            const rect = img.getBoundingClientRect();

            modalImg.src = img.src;
            modalImg.style.position = "fixed";
            modalImg.style.top = rect.top + "px";
            modalImg.style.left = rect.left + "px";
            modalImg.style.width = rect.width + "px";
            modalImg.style.height = rect.height + "px";
            modalImg.style.transition = "0.4s ease";

            modal.style.display = "flex";

            setTimeout(() => {
                modal.classList.add("show");

                modalImg.style.top = "50%";
                modalImg.style.left = "50%";
                modalImg.style.transform = "translate(-50%, -50%)";
                modalImg.style.width = "350px";
                modalImg.style.height = "auto";
            }, 10);

            document.getElementById("modal-nome").innerText = nome;
            document.getElementById("modal-idade").innerText = "Idade: " + idade;
            document.getElementById("modal-desc").innerText = desc;
        }

        function fecharModal() {
            const modal = document.getElementById("modal");
            const modalImg = document.getElementById("modal-img");

            const rect = cardOriginal.getBoundingClientRect();

            modalImg.style.top = rect.top + "px";
            modalImg.style.left = rect.left + "px";
            modalImg.style.width = rect.width + "px";

            setTimeout(() => {
                modal.classList.remove("show");
                modal.style.display = "none";
            }, 300);
        }
    </script>
</body>

</html>
